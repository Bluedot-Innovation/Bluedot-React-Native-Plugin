import groovy.json.JsonSlurper

apply from: file('../../bluedot-react-native/versions.gradle')

def DEFAULT_COMPILE_SDK_VERSION = 36
def DEFAULT_MIN_SDK_VERSION = 29

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    // PointSDK 18.0.0 is compiled with Kotlin 2.3.0 metadata. Declaring the Kotlin gradle
    // plugin classpath unconditionally allows Gradle's "highest version wins" resolution to
    // upgrade the Kotlin compiler to 2.3.0 even when this module is consumed as a library
    // in a host app that defaults to an older Kotlin version.
    ext {
        kotlinVersion = "2.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Always declare so the required Kotlin version is visible to the multi-project build.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.ext.kotlinVersion}"

        // AGP only needed for stand-alone builds.
        if (project == rootProject) {
            classpath 'com.android.tools.build:gradle:8.2.2'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)

    namespace "io.bluedot.pushnotifications"
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
        }
    }
    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

def firebaseBomVersion = safeExtGet('firebaseBomVersion', '34.12.0')

dependencies {
    implementation "com.gitlab.bluedotio.android:point_sdk_push:${pointSdkVersion}"
    implementation "com.gitlab.bluedotio.android:point_sdk_android:${pointSdkVersion}"
    implementation 'com.facebook.react:react-android:0.77.0'
    implementation 'androidx.core:core-ktx:1.15.0'

    implementation platform("com.google.firebase:firebase-bom:${firebaseBomVersion}")
    implementation "com.google.firebase:firebase-messaging"
}

def configureReactNativePom(def pom) {
    def packageJson = new JsonSlurper().parseText(file('../package.json').text)

    pom.project {
        name packageJson.title
        artifactId packageJson.name
        version = packageJson.version
        group = "io.bluedot"
        description packageJson.description
        url packageJson.repository.baseUrl

        licenses {
            license {
                name packageJson.license
                url packageJson.repository.baseUrl + '/blob/master/' + packageJson.licenseFilename
                distribution 'repo'
            }
        }

        developers {
            developer {
                id packageJson.author.username
                name packageJson.author.name
            }
        }
    }
}

afterEvaluate { project ->
    task androidSourcesJar(type: Jar) {
        archiveClassifier.set("sources")
        from android.sourceSets.main.java.srcDirs
        include '**/*.java'
    }

    android.libraryVariants.all { variant ->
        def name = variant.name.capitalize()
        def javaCompileTask = variant.javaCompileProvider.get()
        task "jar${name}"(type: Jar, dependsOn: javaCompileTask) {
            from javaCompileTask.destinationDirectory
        }
    }

    artifacts {
        archives androidSourcesJar
    }

    publishing {
        publications {
            maven(MavenPublication) {
                artifact androidSourcesJar
            }
        }
    }
}
