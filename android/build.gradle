import groovy.json.JsonSlurper

// android/build.gradle

// based on:
//
// * https://github.com/facebook/react-native/blob/0.60-stable/template/android/build.gradle
//   original location:
//   - https://github.com/facebook/react-native/blob/0.58-stable/local-cli/templates/HelloWorld/android/build.gradle
//
// * https://github.com/facebook/react-native/blob/0.60-stable/template/android/app/build.gradle
//   original location:
//   - https://github.com/facebook/react-native/blob/0.58-stable/local-cli/templates/HelloWorld/android/app/build.gradle

def DEFAULT_COMPILE_SDK_VERSION = 36
def DEFAULT_MIN_SDK_VERSION = 26

// ---------------------------------------------------------------------------
// Push Notifications feature flag
//
// Set in the consumer app's android/gradle.properties to opt in to push
// notifications support. When absent or false, all Firebase dependencies and
// push source files are excluded from the build entirely — no google-services
// plugin, no google-services.json, and no Firebase libraries are required.
//
//   bluedotPushEnabled=true
//
// After toggling this flag, run ./gradlew clean before rebuilding.
// ---------------------------------------------------------------------------
def pushEnabled = providers.gradleProperty('bluedotPushEnabled').map { it.toBoolean() }.getOrElse(false)

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    // The Android Gradle plugin is only required when opening the android folder stand-alone.
    // This avoids unnecessary downloads and potential conflicts when the library is included as a
    // module dependency in an application project.
    // ref: https://docs.gradle.org/current/userguide/tutorial_using_tasks.html#sec:build_script_external_dependencies
    if (project == rootProject) {
        ext {
            kotlinVersion = "2.3.0"
        }
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.2.2'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.ext.kotlinVersion}"
        }
    }
}
allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)

    namespace "io.bluedot"
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        versionCode 1
        versionName "1.0"
        // Exposes the flag to Kotlin/Java at runtime so the JS layer can
        // surface a clear error if push APIs are called without the flag set.
        buildConfigField "boolean", "PUSH_ENABLED", "${pushEnabled}"
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
        }
    }
    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main {
            if (pushEnabled) {
                // Activate push source files and swap in the push manifest,
                // which contains all core manifest entries plus DefaultMessagingService.
                java.srcDirs += ['src/push/java']
                manifest.srcFile 'src/push/AndroidManifest.xml'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

}

repositories {
    // ref: https://www.baeldung.com/maven-local-repository
    mavenLocal()
    google()
    mavenCentral()
}

def sdkDependency       = 'com.gitlab.bluedotio.android:point_sdk_android:18.0.0'
def pushSdkDependency   = 'com.gitlab.bluedotio.android:point_sdk_push:18.0.0'

// ---------------------------------------------------------------------------
// Firebase BOM version (only used when bluedotPushEnabled=true)
//
// Override from your app's gradle.properties:
//   firebaseBomVersion=34.0.0
// ---------------------------------------------------------------------------
def firebaseBomVersion = safeExtGet('firebaseBomVersion', '34.12.0')

dependencies {
    implementation sdkDependency
    implementation 'com.facebook.react:react-android:0.77.0'
    implementation 'androidx.core:core-ktx:1.15.0'

    if (pushEnabled) {
        implementation pushSdkDependency
        implementation platform("com.google.firebase:firebase-bom:${firebaseBomVersion}")
        implementation "com.google.firebase:firebase-messaging"
    }
}

def configureReactNativePom(def pom) {
    def packageJson = new JsonSlurper().parseText(file('../package.json').text)

    pom.project {
        name packageJson.title
        artifactId packageJson.name
        version = packageJson.version
        group = "io.bluedot"
        description packageJson.description
        url packageJson.repository.baseUrl

        licenses {
            license {
                name packageJson.license
                url packageJson.repository.baseUrl + '/blob/master/' + packageJson.licenseFilename
                distribution 'repo'
            }
        }

        developers {
            developer {
                id packageJson.author.username
                name packageJson.author.name
            }
        }
    }
}

afterEvaluate { project ->
    // some Gradle build hooks ref:
    // https://www.oreilly.com/library/view/gradle-beyond-the/9781449373801/ch03.html

    task androidSourcesJar(type: Jar) {
        archiveClassifier.set("sources")
        from android.sourceSets.main.java.srcDirs
        include '**/*.java'
    }

    android.libraryVariants.all { variant ->
        def name = variant.name.capitalize()
        def javaCompileTask = variant.javaCompileProvider.get()
        task "jar${name}"(type: Jar, dependsOn: javaCompileTask) {
            from javaCompileTask.destinationDirectory
        }
    }

    artifacts {
        archives androidSourcesJar
    }

    publishing {
        publications {
            maven(MavenPublication) {
                artifact androidSourcesJar
            }
        }
    }
}
